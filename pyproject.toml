[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-numerique"
version = "0.1.0"
description = "Application de recherche en vision par ordinateur pour le contrôle vidéo par gestes de la main"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Votre Nom", email = "votre.email@example.com"}
]
keywords = ["computer-vision", "gesture-recognition", "mediapipe", "human-computer-interaction", "video-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PySide6>=6.5",
  "opencv-python>=4.8,<4.10",
  "PyYAML>=6.0",
  "mediapipe>=0.10.0",
  "numpy<2",
  "matplotlib>=3.7.0"
]

[project.scripts]
vision-numerique = "vision_numerique.main:main"

[tool.setuptools]
packages = ["vision_numerique"]

[tool.setuptools.package-data]
vision_numerique = ["resources/*", "settings.yaml"]